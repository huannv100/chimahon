name: PR build check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Verify and build Chimahon Huan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .github/.java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare FlexibleAdapter source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arkon/FlexibleAdapter vendor/FlexibleAdapter
          git -C vendor/FlexibleAdapter checkout c80135339bcff5f7f8c2c2380329dfc155b26232

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "app.chimahon.huan"' app/build.gradle.kts
          grep -q 'android:label="Chimahon Huan"' app/src/main/AndroidManifest.xml
          grep -q 'ScrollTranslateLookupAccessibilityService' app/src/main/AndroidManifest.xml
          ! grep -q 'OcrTapHint(' app/src/main/java/eu/kanade/tachiyomi/ui/dictionary/ScreenLookupOverlayController.kt
          grep -q 'Manual text selection must win over single-kanji taps' chimahon/src/main/assets/dictionary/renderer.js
          grep -q '_pendingRecursiveSelection' chimahon/src/main/assets/dictionary/renderer.js
          grep -q "addEventListener('pointerdown'" chimahon/src/main/assets/dictionary/renderer.js
          grep -q "const insideHeadword = !!target.closest('.headword')" chimahon/src/main/assets/dictionary/renderer.js
          ! grep -q 'firebase-analytics' gradle/libs.versions.toml
          ! grep -q 'firebase-crashlytics' gradle/libs.versions.toml

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build arm64 preview APK
        run: ./gradlew assemblePreview

      - name: Verify APK identity and contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/preview -name '*arm64-v8a*.apk' -o -name 'app-universal-preview.apk' | head -1)"
          test -n "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='app.chimahon.huan.beta'" /tmp/badging.txt
          unzip -p "$APK" assets/dictionary/renderer.js | grep -q 'Manual text selection must win over single-kanji taps'
          unzip -p "$APK" assets/dictionary/renderer.js | grep -q '_pendingRecursiveSelection'
          unzip -p "$APK" assets/dictionary/renderer.js | grep -q "insideHeadword"
          cp "$APK" Chimahon-Huan-v2.4.6-arm64.apk
          sha256sum Chimahon-Huan-v2.4.6-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chimahon-Huan-v2.4.6-arm64
          path: Chimahon-Huan-v2.4.6-arm64.apk
          if-no-files-found: error

name: PR build check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build patched arm64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout modified source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch official Chimahon v2.4.6 arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o base.apk             https://github.com/Chimahon/chimahon/releases/download/v2.4.6/chimahon-arm64-v8a-v2.4.6.apk

          python3 - <<'PY'
          import zipfile

          base = "base.apk"
          out = "patched-unsigned.apk"
          replacement_path = "chimahon/src/main/assets/dictionary/renderer.js"
          target = "assets/dictionary/renderer.js"

          with open(replacement_path, "rb") as f:
              replacement = f.read()

          found = False
          with zipfile.ZipFile(base, "r") as zin, zipfile.ZipFile(out, "w", allowZip64=True) as zout:
              for info in zin.infolist():
                  name = info.filename
                  upper = name.upper()
                  if upper.startswith("META-INF/") and (
                      upper.endswith(".RSA") or
                      upper.endswith(".DSA") or
                      upper.endswith(".EC") or
                      upper.endswith(".SF") or
                      upper.endswith("MANIFEST.MF")
                  ):
                      continue

                  data = replacement if name == target else zin.read(name)
                  if name == target:
                      found = True
                  zout.writestr(info, data)

          if not found:
              raise SystemExit(f"{target} was not found in the release APK")
          PY

          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f -p 4 patched-unsigned.apk patched-aligned.apk

          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > huan-signing.jks

          "$APKSIGNER" sign \
            --ks huan-signing.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out Chimahon-v2.4.6-Huan-arm64.apk \
            patched-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs Chimahon-v2.4.6-Huan-arm64.apk
          ls -lh Chimahon-v2.4.6-Huan-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chimahon-v2.4.6-Huan-arm64
          path: Chimahon-v2.4.6-Huan-arm64.apk
          if-no-files-found: error

name: PR build check
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Gesture and capture-state regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Compile and execute production gesture policy
        run: ./gradlew -p qa/policy run --console=plain

  format:
    name: Repository formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - run: ./gradlew spotlessCheck --continue

  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone repo and pinned native/adapter sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          show-progress: false
      - name: Remove unused legacy vendor build launcher
        run: |
          # Only vendor Java/resources are used. Never execute its old wrapper.
          rm -f vendor/FlexibleAdapter/gradle/wrapper/gradle-wrapper.jar vendor/FlexibleAdapter/gradlew vendor/FlexibleAdapter/gradlew.bat
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Build installable preview
        run: |
          ./gradlew :app:assemblePreview -PreleaseVersionName=2.4.6-scroll-lookup.3 -PreleaseVersionCode=24603 --console=plain > build-output.log 2>&1 || { tail -n 150 build-output.log; exit 1; }
          tail -n 25 build-output.log
      - name: Run unit tests including tap and capture policy
        run: |
          ./gradlew :app:testReleaseUnitTest --console=plain > unit-test-output.log 2>&1 || { tail -n 150 unit-test-output.log; exit 1; }
          tail -n 30 unit-test-output.log
      - name: Upload test reports and full logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports-and-logs-${{ github.sha }}
          path: |
            app/build/reports/tests/
            build-output.log
            unit-test-output.log
          if-no-files-found: ignore
      - name: Upload arm64 APK after successful build and tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimahon-2.4.6-scroll-lookup-arm64
          path: app/build/outputs/apk/preview/*arm64-v8a*.apk
          if-no-files-found: error
      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimahon-2.4.6-scroll-lookup-universal
          path: app/build/outputs/apk/preview/*universal*.apk
          if-no-files-found: error

name: Quick ARM64 test APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          show-progress: false

      - name: Remove unused legacy vendor wrapper
        run: rm -f vendor/FlexibleAdapter/gradle/wrapper/gradle-wrapper.jar vendor/FlexibleAdapter/gradlew vendor/FlexibleAdapter/gradlew.bat

      - name: Limit this CI build to arm64-v8a
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/build.gradle.kts")
          s = app.read_text()
          s = s.replace('isUniversalApk = true', 'isUniversalApk = false')
          s = s.replace('include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")', 'include("arm64-v8a")')
          app.write_text(s)

          p = Path("chimahon-local-ocr/build.gradle.kts")
          s = p.read_text()
          needle = '''    defaultConfig {
          externalNativeBuild {'''
          repl = '''    defaultConfig {
          ndk {
              abiFilters += "arm64-v8a"
          }
          externalNativeBuild {'''
          if needle not in s:
              raise SystemExit("local OCR defaultConfig anchor not found")
          p.write_text(s.replace(needle, repl))
          PY

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Build ARM64 preview APK
        run: ./gradlew :app:assemblePreview -PreleaseVersionName=2.4.6-scroll-lookup-s24 -PreleaseVersionCode=24604 --console=plain

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimahon-S24-scroll-lookup-arm64
          path: app/build/outputs/apk/preview/*arm64-v8a*.apk
          if-no-files-found: error
